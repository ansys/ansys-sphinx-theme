name: Backstop test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # To checkout code

env:
  NODE_VERSION: "25.2.1"
  PYTHON_VERSION: "3.14"

jobs:
  backstop-tests:
    name: Visual regression and browser tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          npm install

      - name: Install xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            pandoc \
            texlive-xetex \
            texlive-fonts-extra \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-luatex \
            texlive-science \
            latexmk \
            fonts-lmodern

      - name: Create virtual environment
        run: uv venv

      - name: Build documentation
        run: |
          source .venv/bin/activate
          uv pip install --group doc --group browser-test .
          python -m playwright install --with-deps chromium
          xvfb-run make -C doc html

      - name: Serve documentation for BackstopJS
        run: |
          PORT=$(python3 -c "import socket; s = socket.socket(); s.bind(('127.0.0.1', 0)); print(s.getsockname()[1])")
          echo "BACKSTOP_BASE_URL=http://localhost:${PORT}" >> "$GITHUB_ENV"
          npx http-server -u -p "${PORT}" ./doc/_build/html &

      - name: Check if server is up
        run: curl -fsSI --retry 10 --retry-connrefused --retry-delay 1 "$BACKSTOP_BASE_URL"

      - name: Run BackstopJS tests
        run: npm run reference-tests

      - name: Run browser tests
        if: ${{ !cancelled() }}
        run: |
          source .venv/bin/activate
          npm run browser-test

      - name: Upload Backstop report (if failed)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backstop-report
          path: tests/backstop_data/html_report

      - name: Upload Playwright traces (if failed)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: ignore


ci:
  autofix_commit_msg: 'chore: auto fixes from pre-commit hooks'
  autoupdate_commit_msg: 'chore: pre-commit automatic update'
  autoupdate_schedule: weekly
  skip: [ty]

repos:

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 38bfb07c0c64c304f47eb52090f8288150c77730  # frozen: v0.17.1
  hooks:
    - id: ruff
      args: [--fix]
    - id: ruff-format

- repo: https://github.com/codespell-project/codespell
  rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
  hooks:
  - id: codespell
    args: ["--ignore-words", "doc/styles/config/vocabularies/ANSYS/accept.txt", "-w"]

- repo: https://github.com/pycontribs/mirrors-prettier
  rev: c79518d33a81b378af7b186e99e360a2c9b63223  # frozen: v3.6.2
  hooks:
  - id: prettier
    types_or: [css, javascript]

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-merge-conflict
  - id: debug-statements
  - id: check-yaml
  - id: trailing-whitespace

# this validates our github workflow files
- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: 4f85d46a92dc17713078e5de73f8a13190edf6fc  # frozen: 0.38.2
  hooks:
    - id: check-github-workflows
    - id: check-dependabot


- repo: https://github.com/ansys/pre-commit-hooks
  rev: 55c5b6a5439abd847613579c6924da750e8b78b2  # frozen: v0.8.0
  hooks:
  - id: add-license-headers
    files: '(src|doc/source/examples)/.*\.(py)'
    args:
    - --start_year=2021
    - --custom_license=Apache-2.0


- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: c92afdf2c6ca336aaa8f39e2bd8d48f62dbd8e1f  # frozen: v1.31.1
  hooks:
    - id: zizmor
      args:
      - "--no-progress"
      - "--persona=pedantic"

# Do not use this tool with proprietary ansys source code.
- repo: "https://github.com/djlint/djLint"
  rev: 1399b56bfc493191c39ff1a525a8ab9c11201cd3  # frozen: v1.46.6
  hooks:
    - id: djlint-jinja
      types_or: ["html"]

- repo: https://github.com/astral-sh/ty-pre-commit
  rev: "033aa05ea3f6f5f7cd39bcb6a31fd66f6efbed2f"  # frozen: v0.0.89
  hooks:
    - id: ty

- repo: https://github.com/ansys/pre-commit-hooks
  rev: 9866a3baebfc3d7cf51092b65b7845f2caf8223b
  hooks:
    - id: pyansys-quality-report
      args:
      - --ignore=RM005
      - --show-all
      # verbose: true
      # args:
      # - --family=cicd

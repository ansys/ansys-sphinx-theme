ci:
  skip: [ty]

repos:

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: c0f278f1254ccc8fb09676bcdb8d847e7db493e5  # frozen: v0.17.4
  hooks:
    - id: ruff
      args: [--fix]
    - id: ruff-format

- repo: https://github.com/codespell-project/codespell
  rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
  hooks:
  - id: codespell
    args: ["--ignore-words", "doc/styles/config/vocabularies/ANSYS/accept.txt", "-w"]

- repo: https://github.com/pycontribs/mirrors-prettier
  rev: c79518d33a81b378af7b186e99e360a2c9b63223  # frozen: v3.6.2
  hooks:
  - id: prettier
    types_or: [css, javascript]

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-merge-conflict
  - id: debug-statements
  - id: check-yaml
  - id: trailing-whitespace

# this validates our github workflow files
- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: 39478bf2c099a58683d3f1aedf675105318b078d  # frozen: 0.39.0
  hooks:
    - id: check-github-workflows

- repo: https://github.com/ansys/pre-commit-hooks
  rev: dbcd0a4ad0060f78ac3c7d53d342f510edc48eab  # frozen: v0.8.1
  hooks:
  - id: add-license-headers
    files: '(src|doc/source/examples)/.*\.(py)'
    args:
    - --start_year=2021
    - --custom_license=Apache-2.0


- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: 06a39750ec31860bb44f2acf67182c40016cd1e7  # frozen: v1.32.0
  hooks:
    - id: zizmor
      args:
      - "--no-progress"
      - "--persona=pedantic"

# Do not use this tool with proprietary ansys source code.
- repo: "https://github.com/djlint/djLint"
  rev: 291f0f5d120ad016b3ff63a863c7fe8ad59402a5  # frozen: v1.49.10
  hooks:
    - id: djlint-jinja
      types_or: ["html"]

- repo: https://github.com/astral-sh/ty-pre-commit
  rev: "3770e13b40bb462aff3ae635783fac7a7cc844bb"  # frozen: v0.0.100
  hooks:
    - id: ty
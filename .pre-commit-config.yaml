ci:
  skip: [ty]

repos:

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 9026c9127e153371d7a78dfcb0c45ae2046a3d10  # frozen: v0.17.6
  hooks:
    - id: ruff
      args: [--fix]
    - id: ruff-format

- repo: https://github.com/codespell-project/codespell
  rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
  hooks:
  - id: codespell
    args: ["--ignore-words", "doc/styles/config/vocabularies/ANSYS/accept.txt", "-w"]

- repo: https://github.com/pycontribs/mirrors-prettier
  rev: c79518d33a81b378af7b186e99e360a2c9b63223  # frozen: v3.6.2
  hooks:
  - id: prettier
    types_or: [css, javascript]

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-merge-conflict
  - id: debug-statements
  - id: check-yaml
  - id: trailing-whitespace

# this validates our github workflow files
- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: 39478bf2c099a58683d3f1aedf675105318b078d  # frozen: 0.39.0
  hooks:
    - id: check-github-workflows

- repo: https://github.com/ansys/pre-commit-hooks
  rev: 5040e1fffc2867225e12b55a15e11d207663f1a6  # frozen: v0.8.4
  hooks:
  - id: add-license-headers
    files: '(src|doc/source/examples)/.*\.(py)'
    args:
    - --start_year=2021
    - --custom_license=Apache-2.0


- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: c7d31dc612dffdd4d3b2f2b88b9660d3ab057ee8  # frozen: v1.33.1
  hooks:
    - id: zizmor
      args:
      - "--no-progress"
      - "--persona=pedantic"

# Do not use this tool with proprietary ansys source code.
- repo: "https://github.com/djlint/djLint"
  rev: ba83fa585bc2e2bf853a8eb50e297c14f0a652b5  # frozen: v1.54.0
  hooks:
    - id: djlint-jinja
      types_or: ["html"]

- repo: https://github.com/astral-sh/ty-pre-commit
  rev: "31ea340b6f1d06c26485118b1265e49cfc4fb114"  # frozen: v0.0.108
  hooks:
    - id: ty
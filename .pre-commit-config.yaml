ci:
  autofix_commit_msg: 'chore: auto fixes from pre-commit hooks'
  autoupdate_commit_msg: 'chore: pre-commit automatic update'
  autoupdate_schedule: weekly
  skip: [ty]

repos:

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: e8f7d69b957a30acb2c875078d5fd012de24b64c  # frozen: v0.16.7
  hooks:
    - id: ruff
      args: [--fix]
    - id: ruff-format

- repo: https://github.com/codespell-project/codespell
  rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
  hooks:
  - id: codespell
    args: ["--ignore-words", "doc/styles/config/vocabularies/ANSYS/accept.txt", "-w"]

- repo: https://github.com/pycontribs/mirrors-prettier
  rev: c79518d33a81b378af7b186e99e360a2c9b63223  # frozen: v3.6.2
  hooks:
  - id: prettier
    types_or: [css, javascript]

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-merge-conflict
  - id: debug-statements
  - id: check-yaml
  - id: trailing-whitespace

# this validates our github workflow files
- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: c4654a7e007c9619a5eb63c39a456572a0fa1851  # frozen: 0.38.0
  hooks:
    - id: check-github-workflows

- repo: https://github.com/ansys/pre-commit-hooks
  rev: 55c5b6a5439abd847613579c6924da750e8b78b2  # frozen: v0.8.0
  hooks:
  - id: add-license-headers
    files: '(src|doc/source/examples)/.*\.(py)'
    args:
    - --start_year=2021
    - --custom_license=Apache-2.0


- repo: https://github.com/zizmorcore/zizmor-pre-commit
  rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
  hooks:
    - id: zizmor
      args:
      - "--no-progress"
      - "--persona=pedantic"

# Do not use this tool with proprietary ansys source code.
- repo: "https://github.com/djlint/djLint"
  rev: 152599a9c13abe14c25b8bdf023c8306975ddc3f  # frozen: v1.46.1
  hooks:
    - id: djlint-jinja
      types_or: ["html"]

- repo: https://github.com/astral-sh/ty-pre-commit
  rev: "166c7027240501d219155fe71ad9817f8d69237b"  # frozen: v0.0.80
  hooks:
    - id: ty